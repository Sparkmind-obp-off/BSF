<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BSF Factory</title><style>body{font-family:system-ui;margin:0;background:#f6f7f9;color:#17181a}main{max-width:1100px;margin:40px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}.muted{color:#666}.state{font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer}pre{white-space:pre-wrap}</style></head>
<body><main><h1>BSF — Business System Factory</h1><p class="muted">Build business systems like a factory, not from zero.</p><section class="grid"><div class="card"><h2>Official Systems</h2><div id="systems">Loading…</div></div><div class="card"><h2>Modules</h2><div id="modules">Loading…</div></div><div class="card"><h2>Builds</h2><div id="builds">Loading…</div><div class="actions"><button id="new">Create Custom Build</button><button id="refresh">Refresh</button></div></div></section><h2>Factory State</h2><pre id="output">Select an action.</pre></main>
<script>
const out=document.querySelector('#output');
async function api(path,opts){const r=await fetch('/api'+path,opts);const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Request failed');return j.data??j}
async function load(){const [s,m,b]=await Promise.all([api('/systems'),api('/modules'),api('/builds')]);systems.innerHTML=s.map(x=>`<p><b>${x.name}</b><br><span class="muted">${x.purpose}</span></p>`).join('');modules.innerHTML=m.map(x=>`<p><b>${x.name}</b><br><span class="muted">${x.capabilities.join(', ')}</span></p>`).join('');builds.innerHTML=b.length?b.map(x=>`<p><b>${x.name}</b> <span class="state">${x.state}</span><br>${x.source} · rev ${x.revision}</p>`).join(''):'<p class="muted">No builds yet.</p>';}
new.onclick=async()=>{try{const name=prompt('Build name','My Business System');if(!name)return;const b=await api('/builds',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,source:'custom'})});out.textContent=JSON.stringify(b,null,2);await load()}catch(e){out.textContent=e.message}};refresh.onclick=load;load().catch(e=>out.textContent=e.message);
</script></body></html>
